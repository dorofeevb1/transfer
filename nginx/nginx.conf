# CIS NGINX 2.2.1 v2.1.0
user                nginx;
worker_processes    auto;
# worker_cpu_affinity auto; # This directive is not available on Alpine's Nginx build
pid                 /var/run/nginx.pid;

# Enable JIT for better regex performance
pcre_jit on;

events
{
    worker_connections 1024; # Adjusted for Alpine's typical use case
    multi_accept       on;
    use                epoll;
}

# worker_rlimit_nofile = (worker_connections * 1) + 500
# worker_rlimit_nofile = (worker_connections * 2) + 500 if you use NGINX as reverse proxy

worker_rlimit_nofile 2548;

http
{
    #
    # [ Basic Settings ]
    #

    server_names_hash_bucket_size 64;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Not specifying an webroot within a server block or location block can make
    # files accessible to the interent that you weren't intending to be public.
    # This sets an default empty webroot to avoid that from happening.
    root /var/www/empty-webroot/;

    # Включаем конфигурации сайтов. Логика default_server и редиректов
    # теперь будет находиться внутри этих файлов.
    include /etc/nginx/conf.d/*.conf;

    #
    # [ TLS Settings ]
    #

    # CIS NGINX 4.1.14, 4.1.12, 4.1.5 and 4.1.4 v2.1.0
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ecdh_curve            X25519:secp384r1;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;
    ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    #
    # [ Information Leakage ]
    #

    # Hide server software/versions
    # CIS NGINX 2.5.1 and 2.5.4 v2.1.0
    proxy_hide_header MicrosoftSharePointTeamServices;
    proxy_hide_header X-Application-Version;
    proxy_hide_header X-AspNetMvc-Version;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-Backend;
    proxy_hide_header X-Cocoon-Version;
    proxy_hide_header X-OWA-Version;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Powered-By-Plesk;
    proxy_hide_header X-Powered-CMS;
    proxy_hide_header X-PHP-Version;
    proxy_hide_header X-Redirect-By;
    proxy_hide_header X-Runtime;
    proxy_hide_header X-Server-Powered-By;
    server_tokens     off;

    #
    # [ Common Security Headers ]
    # Заменяем more_set_headers на стандартную директиву add_header
    #
    add_header X-XSS-Protection "0" always; # Disable insecure XSS auditor on old browsers
    add_header X-Content-Type-Options "nosniff" always; # Don't guess mime type to avoid XSS
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Попытка скрыть заголовок Server стандартными средствами
    add_header Server "" always;


    #
    # [ Logging Settings ]
    #

    # Always log by default
    # CIS NGINX 3.3, 3.2, and 3.1 v2.1.0
    access_log /dev/stdout;
    error_log  /dev/stderr info;

    #
    # [ Compression Settings - Gzip ]
    #

    gzip              on;
    gzip_min_length   1000;
    gzip_disable      "msie6";
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        image/bmp
        image/svg+xml
        image/x-icon
        font/opentype
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml
        application/xml+rss;

    #
    # [ Performance and Cache ]
    #

    # aio threads; # Not available in Alpine's Nginx build

    # Cache frequently accessed files
    open_file_cache          max=2000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    #
    # [ Basic DoS mitigations ]
    #
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn      conn_per_ip 50;
    limit_req_zone $binary_remote_addr zone=default_ratelimit:10m rate=300r/m;
    limit_req      zone=default_ratelimit burst=50 nodelay;
    limit_req_status  429;
    limit_conn_status 429;

    #
    # [ Buffers and timeout ]
    #
    client_max_body_size        20M; # Increased for file uploads
    client_header_buffer_size   2k;
    large_client_header_buffers 4 4k;
    client_body_buffer_size     64k;
    client_body_timeout   15;
    client_header_timeout 15;
    keepalive_timeout     15;
    send_timeout          15;
}
