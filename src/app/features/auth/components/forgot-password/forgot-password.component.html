<div class="auth-container">
    <div class="auth-form-wrapper">
        <div class="logo-container">
            <img src="assets/logo.png" alt="PRO TRADE & LOGISTIC">
        </div>
        <div class="auth-form">
            <h1 class="auth-title">Забыли пароль?</h1>
            <p class="auth-subtitle">Укажите e-mail, чтобы мы отправили вам новый пароль</p>

            <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="anton.vav@yandex.ru" formControlName="email"
                        class="form-control" [ngClass]="{ 'is-invalid': submitted && f['email'].errors }">
                    <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                        <div *ngIf="f['email'].errors['required']">E-mail обязателен</div>
                        <div *ngIf="f['email'].errors['email']">Введите корректный e-mail</div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" (click)="goBack()">← НАЗАД</button>
                    <button type="submit" class="btn btn-primary">ОТПРАВИТЬ</button>
                </div>
            </form>
        </div>
    </div>
    <div class="auth-image-wrapper"></div>
</div>
