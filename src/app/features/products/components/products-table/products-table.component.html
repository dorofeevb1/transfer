<div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>
        <!-- Колонка с чекбоксами -->
        <ng-container matColumnDef="select" [sticky]="true">
            <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox *ngIf="dataSource && dataSource.data.length > 0" (change)="masterToggleClick.emit()"
                    [checked]="selection.hasValue() && isAllSelected"
                    [indeterminate]="selection.hasValue() && !isAllSelected" [aria-label]="checkboxLabel()">
                </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
                <mat-checkbox (click)="$event.stopPropagation()" (change)="rowToggleClick.emit(row)"
                    [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
                </mat-checkbox>
            </td>
        </ng-container>

        <!-- Динамическое создание колонок (без изменений) -->
        <ng-container *ngFor="let column of allColumns" [matColumnDef]="column.id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                <div class="column-header">
                    <span>{{ column.name | titlecase }}</span>
                    <button mat-icon-button (click)="removeColumnClick.emit({ columnId: column.id, event: $event })"
                        matTooltip="Удалить столбец">
                        <mat-icon>close</mat-icon>
                    </button>
                </div>
            </th>
            <td mat-cell *matCellDef="let element">

                <!-- Главное условие: если режим массового редактирования И строка выбрана -->
                <ng-container *ngIf="isBulkEditMode && selection.isSelected(element); else readOnlyCell">

                    <!-- ТОГДА: показываем поле для ввода -->
                    <mat-form-field appearance="outline" class="inline-edit-field">
                        <input matInput [(ngModel)]="element[column.id]" (click)="$event.stopPropagation()">
                    </mat-form-field>

                </ng-container>

                <!-- ИНАЧЕ: показываем ячейку только для чтения -->
                <ng-template #readOnlyCell>

                    <!-- Внутри этого блока уже идет ваша стандартная логика -->
                    <ng-container *ngIf="isImageArray(element[column.id]); else defaultCell">
                        <!-- Показываем картинку -->
                        <div class="image-cell-container" (click)="photoViewerClick.emit(element[column.id])">
                            <img [src]="element[column.id][0] | safeUrl" class="thumbnail-image" alt="Image">
                            <span *ngIf="element[column.id].length > 1" class="photo-count">
                                +{{ element[column.id].length - 1 }}
                            </span>
                        </div>
                    </ng-container>

                    <!-- Или показываем обычный текст -->
                    <ng-template #defaultCell>
                        {{ element[column.id] }}
                    </ng-template>

                </ng-template>
            </td>

        </ng-container>

        <!-- Рендеринг строк (без изменений) -->
        <tr mat-header-row *matHeaderRowDef="columnsToRender; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: columnsToRender;" (click)="rowToggleClick.emit(row)"></tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="columnsToRender.length">Нет данных.</td>
        </tr>
    </table>
</div>
