<h1 mat-dialog-title>{{ data.title }}</h1>

<div mat-dialog-content>
    <p>`{{ data.message }}`</p>
</div>

<div mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">{{ 'DIALOGS.CANCEL_BUTTON' | translate }}</button>
    <button mat-flat-button color="warn" [mat-dialog-close]="true" cdkFocusInitial>{{ 'PRODUCTS.DELETE' | translate
        }}</button>
</div>
