<h2 mat-dialog-title>Просмотр изображений</h2>
<mat-dialog-content class="photo-grid">
    <div *ngFor="let photo of data.photos" class="photo-container">
        <img [src]="photo" alt="Изображение товара">
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Закрыть</button>
</mat-dialog-actions>
