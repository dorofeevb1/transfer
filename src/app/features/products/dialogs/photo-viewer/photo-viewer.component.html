<h2 mat-dialog-title>{{ 'DIALOGS.PHOTO_VIEWER_TITLE' | translate }}</h2>

<mat-dialog-content class="photo-grid">
    <div *ngFor="let photo of data.photos" class="photo-container">
        <img [src]="photo | safeUrl" [alt]="'DIALOGS.PRODUCT_IMAGE_ALT' | translate">
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close cdkFocusInitial>{{ 'DIALOGS.CLOSE_BUTTON' | translate }}</button>
</mat-dialog-actions>
