<div class="controls-row">
    <!-- Левая часть: Поиск, Экспорт, Фильтры, Сортировка -->
    <div class="left-group">

        <!-- Поиск -->
        <div class="search-field">
            <input type="text" [placeholder]="'PRODUCTS.SEARCH_PLACEHOLDER' | translate"
                (keyup)="globalFilterChange.emit($event)">
            <button class="search-btn" disabled>
                <mat-icon>search</mat-icon>
            </button>
        </div>

        <!-- Экспорт -->
        <div class="export-wrapper">
            <button class="btn-outline" [matMenuTriggerFor]="exportMenu" [disabled]="!selectionHasValue">
                <mat-icon class="icon-left">ios_share</mat-icon>
                {{ 'PRODUCTS.EXPORT' | translate }}
                <mat-icon class="chevron">expand_more</mat-icon>
            </button>
            <mat-menu #exportMenu="matMenu">
                <button mat-menu-item (click)="exportToExcel.emit()">Excel</button>
                <button mat-menu-item (click)="exportToCsv.emit()">CSV</button>
            </mat-menu>
        </div>

        <!-- Фильтры -->
        <button class="btn-outline" (click)="toggleFilter.emit()">
            <mat-icon class="icon-left">filter_list</mat-icon>
            {{ 'PRODUCTS.FILTERS' | translate }}
            <span *ngIf="activeFilterCount > 0" class="badge">{{ activeFilterCount }}</span>
        </button>

        <!-- Сортировка таблицы -->
        <button class="btn-outline" [matMenuTriggerFor]="columnsMenu">
            <mat-icon class="icon-left">tune</mat-icon>
            {{ 'PRODUCTS.TABLE_SORT' | translate }}
        </button>

    </div>

    <!-- Правая часть: Импорт (скрыт для менеджера) -->
    <div class="right-group">
        <button class="btn-import" (click)="importClick.emit()" *ngIf="canImport">
            <mat-icon>download</mat-icon>
            {{ 'PRODUCTS.IMPORT' | translate }}
        </button>
    </div>
</div>

<!-- Панель массовых действий -->
<div class="bulk-actions-bar" *ngIf="selectionHasValue">
    <span class="selected-label">{{ 'PRODUCTS.SELECTED' | translate }}: {{ selectionCount }}</span>

    <div class="bulk-buttons">
        <ng-container *ngIf="!isBulkEditMode">
            <button mat-button class="action-btn" (click)="editClick.emit()">
                <mat-icon>edit</mat-icon> {{ 'PRODUCTS.EDIT' | translate }}
            </button>
            <button mat-button class="action-btn text-red" (click)="deleteClick.emit()">
                <mat-icon>delete</mat-icon> {{ 'PRODUCTS.DELETE' | translate }}
            </button>
        </ng-container>

        <ng-container *ngIf="isBulkEditMode">
            <button mat-flat-button color="primary" (click)="onSaveClick()">{{ 'PRODUCTS.SAVE' | translate }}</button>
            <button mat-button (click)="cancelClick.emit()">{{ 'PRODUCTS.CANCEL' | translate }}</button>
        </ng-container>
    </div>
</div>

<!-- Меню колонок -->
<mat-menu #columnsMenu="matMenu" class="columns-menu">
    <div (click)="$event.stopPropagation()" [formGroup]="columnsForm" class="columns-menu-content">
        <div class="columns-list">
            <div *ngFor="let column of allColumns" class="column-option">
                <mat-checkbox [formControlName]="column.id" color="primary">
                    {{ (column.name) | translate }}
                </mat-checkbox>
            </div>
        </div>
        <div class="columns-menu-actions">
            <button mat-menu-item (click)="applyColumnChanges.emit()">{{ 'PRODUCTS.APPLY' | translate }}</button>
        </div>
    </div>
</mat-menu>
