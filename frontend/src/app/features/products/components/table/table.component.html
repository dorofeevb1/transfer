<!-- Контейнер для страницы с боковой панелью (Sidenav) -->
<mat-sidenav-container class="page-sidenav-container">


    <mat-sidenav #filterSidenav mode="over" position="end" class="filter-sidenav" [fixedInViewport]="true"
        [fixedTopGap]="0" [fixedBottomGap]="0">
        <app-filter-form [form]="filterForm" (apply)="applySideNavFilters()" (reset)="resetSideNavFilters()"
            (close)="filterSidenav.close()">
        </app-filter-form>
    </mat-sidenav>

    <!-- Основной контент страницы -->
    <mat-sidenav-content class="page-content-wrapper">
        <div class="table-page-layout">

            <!-- 1. Заголовок страницы (Товары + Кнопки Импорта) -->
            <app-page-header (importClick)="openImportDialog()" (addColumnClick)="addColumn()">
            </app-page-header>

            <!-- 2. Панель управления (Поиск, Фильтр, Экспорт) -->
            <app-table-controls [allColumns]="allColumns" [columnsForm]="columnsForm"
                [activeFilterCount]="activeFilterCount" [appliedFilters]="appliedFilters"
                [selectionHasValue]="selection.hasValue()" [selectionCount]="selection.selected.length"
                [isBulkEditMode]="isBulkEditMode" (globalFilterChange)="applyGlobalFilter($event)"
                (toggleFilter)="filterSidenav.toggle()" (applyColumnChanges)="applyColumnChanges()"
                (removeFilter)="onRemoveFilter($event)" (editClick)="onEditClick()" (saveClick)="onSaveBulkChanges()"
                (cancelClick)="onCancelBulkEdit()" (deleteClick)="onDeleteSelected()"
                (exportToExcel)="handleExportToExcel()" (exportToCsv)="handleExportToCsv()">
            </app-table-controls>

            <!-- 3. Таблица с данными -->
            <div class="table-wrapper" *ngIf="showTable">
                <app-products-table [dataSource]="dataSource" [selection]="selection" [allColumns]="allColumns"
                    [isBulkEditMode]="isBulkEditMode" [columnsToRender]="columnsToRender"
                    [isAllSelected]="isAllSelected()" (sortChange)="setSort($event)"
                    (removeColumnClick)="removeColumn($event.columnId, $event.event)"
                    (photoViewerClick)="openPhotoViewer($event)" (masterToggleClick)="masterToggle()"
                    (rowToggleClick)="selection.toggle($event)">
                </app-products-table>
            </div>

            <!-- 4. Пагинация (Закреплена внизу или идет следом) -->
            <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons class="sticky-paginator"
                (page)="onPageChange($event)"></mat-paginator>

        </div>
    </mat-sidenav-content>

</mat-sidenav-container>
