<h1 mat-dialog-title class="dialog-title">
    <!-- Меняем иконку на warn только если цвет кнопки warn (красный) -->
    <mat-icon [class.warning-icon]="data.confirmColor === 'warn'" class="dialog-icon">
        {{ data.confirmColor === 'warn' ? 'warning_amber' : 'info_outline' }}
    </mat-icon>
    {{ data.title }}
</h1>

<div mat-dialog-content class="dialog-content">
    <p class="dialog-message">{{ data.message }}</p>
    <!-- Показываем подтекст только если он передан -->
    <p class="dialog-subtext" *ngIf="data.subtext">{{ data.subtext }}</p>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button class="btn-cancel" (click)="onCancel()">
        {{ data.cancelText || ('DIALOGS.CANCEL_BUTTON' | translate) }}
    </button>

    <!-- Цвет и текст кнопки берем из data, либо дефолтные значения -->
    <button mat-flat-button [color]="data.confirmColor || 'warn'" [mat-dialog-close]="true" cdkFocusInitial>
        {{ data.confirmText || ('PRODUCTS.DELETE' | translate) }}
    </button>
</div>
