<div class="filter-container">
    <!-- HEADER -->
    <div class="filter-header">
        <h2 class="filter-title">Фильтр</h2>
        <button mat-icon-button (click)="onClose()" class="close-button">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- CONTENT -->
    <div class="filter-content">

        <!-- Выбор диапазона дат -->
        <div class="date-section">
            <mat-form-field appearance="outline" class="full-width custom-field">
                <mat-label>Выберите период</mat-label>
                <mat-date-range-input [rangePicker]="picker">
                    <input matStartDate [(ngModel)]="dateFrom" placeholder="С">
                    <input matEndDate [(ngModel)]="dateTo" placeholder="По">
                </mat-date-range-input>
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-date-range-picker #picker></mat-date-range-picker>
            </mat-form-field>
        </div>

        <!-- Аккордеон фильтров -->
        <mat-accordion multi displayMode="flat">

            <!-- Категория. Уровень 1 -->
            <mat-expansion-panel class="filter-panel">
                <mat-expansion-panel-header>
                    <mat-panel-title>Категория. Уровень 1</mat-panel-title>
                </mat-expansion-panel-header>
                <div class="panel-content">
                    <div class="checkbox-list">
                        <mat-checkbox [(ngModel)]="category1All" (change)="toggleAllCategory1()"
                            class="checkbox-item">Выбрать все</mat-checkbox>
                        <mat-checkbox *ngFor="let cat of category1Options"
                            [(ngModel)]="cat.selected"
                            (change)="onCategory1Change()"
                            class="checkbox-item">{{ cat.name }}</mat-checkbox>
                    </div>
                </div>
            </mat-expansion-panel>

            <!-- Категория. Уровень 2 -->
            <mat-expansion-panel class="filter-panel">
                <mat-expansion-panel-header>
                    <mat-panel-title>Категория. Уровень 2</mat-panel-title>
                </mat-expansion-panel-header>
                <div class="panel-content">
                    <div class="checkbox-list">
                        <mat-checkbox [(ngModel)]="category2All" (change)="toggleAllCategory2()"
                            class="checkbox-item">Выбрать все</mat-checkbox>
                        <mat-checkbox *ngFor="let cat of category2Options"
                            [(ngModel)]="cat.selected"
                            (change)="onCategory2Change()"
                            class="checkbox-item">{{ cat.name }}</mat-checkbox>
                    </div>
                </div>
            </mat-expansion-panel>

            <!-- Упаковка товара -->
            <mat-expansion-panel class="filter-panel">
                <mat-expansion-panel-header>
                    <mat-panel-title>Упаковка товара</mat-panel-title>
                </mat-expansion-panel-header>
                <div class="panel-content">
                    <div class="checkbox-list">
                        <mat-checkbox [(ngModel)]="packageAll" (change)="toggleAllPackage()"
                            class="checkbox-item">Выбрать все</mat-checkbox>
                        <mat-checkbox *ngFor="let pkg of packageOptions"
                            [(ngModel)]="pkg.selected"
                            (change)="onPackageChange()"
                            class="checkbox-item">{{ pkg.name }}</mat-checkbox>
                    </div>
                </div>
            </mat-expansion-panel>

        </mat-accordion>
    </div>

    <!-- FOOTER -->
    <div class="filter-footer">
        <button mat-stroked-button class="btn-reset" (click)="onReset()">
            Сбросить фильтр
        </button>
        <button mat-flat-button class="btn-apply" (click)="onApply()">
            Применить фильтр
        </button>
    </div>
</div>
