<h1 mat-dialog-title class="dialog-title">{{ 'DIALOGS.ADD_PHOTO_TITLE' | translate }}</h1>

<div mat-dialog-content class="dialog-content">

    <!-- Область загрузки (Drag & Drop) -->
    <div class="upload-area" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)"
        (click)="fileInput.click()" [class.drag-over]="isDragOver">

        <input type="file" #fileInput (change)="onFileSelected($event)" multiple hidden accept="image/*">

        <div class="upload-placeholder">
            <mat-icon class="upload-icon">cloud_upload</mat-icon>
            <p class="upload-text">{{ 'DIALOGS.DRAG_DROP_FILES' | translate }}</p>
            <span class="upload-hint">или нажмите для выбора</span>
        </div>
    </div>

    <!-- Сетка превью -->
    <div class="preview-grid" *ngIf="previews.length > 0">
        <div *ngFor="let preview of previews; let i = index" class="preview-item">
            <img [src]="preview.url" alt="Preview">
            <!-- Кнопка удаления (Красный крестик) -->
            <button class="remove-btn" (click)="removeFile(i)" aria-label="Remove image">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>

    <!-- Сообщение, если пусто -->
    <div class="empty-state" *ngIf="previews.length === 0">
        <p>Файлы еще не выбраны</p>
    </div>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button class="btn-cancel" (click)="onCancel()">
        {{ 'DIALOGS.CANCEL_BUTTON' | translate }}
    </button>
    <button mat-flat-button class="btn-save" (click)="onSave()" [disabled]="previews.length === 0">
        {{ 'DIALOGS.ADD_PHOTO' | translate }}
    </button>
</div>
