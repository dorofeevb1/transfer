<div class="edit-dialog-header">
    <h1 class="dialog-title">{{ 'DIALOGS.EDIT_ITEM_TITLE' | translate }}</h1>
    <button mat-icon-button class="close-button" (click)="onCancel()" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
    </button>
</div>

<div mat-dialog-content [formGroup]="form" class="dialog-scrollable-content">

    <!-- СЕКЦИЯ ФОТО (Сверху, как самое важное) -->
    <div class="form-section">
        <label class="section-label">{{ 'DIALOGS.PHOTOS_LABEL' | translate }}</label>

        <div class="photos-grid">
            <!-- Существующие фото -->
            <div *ngFor="let image of imagesControl.value; let i = index" class="photo-item">
                <img [src]="image | safeUrl" alt="Product image">
                <button class="remove-btn" (click)="removeImage(i)" aria-label="Remove image">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>

            <!-- Кнопка добавления -->
            <button class="add-photo-btn" (click)="openAddPhotoDialog()">
                <mat-icon>add_a_photo</mat-icon>
                <span>Добавить</span>
            </button>
        </div>
    </div>

    <!-- ДИНАМИЧЕСКИЕ ПОЛЯ -->
    <div class="fields-container">
        <ng-container *ngFor="let key of objectKeys(form.controls)">
            <!-- Скрываем id, images и системные поля -->
            <div *ngIf="key !== 'id' && key !== 'images' && !key.startsWith('_')" class="form-field-wrapper">
                <label class="field-label">{{ ('FIELDS.' + key) | translate }}</label>
                <mat-form-field appearance="outline" class="custom-field">
                    <input matInput [formControlName]="key">
                </mat-form-field>
            </div>
        </ng-container>
    </div>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button class="btn-cancel" (click)="onCancel()">
        {{ 'DIALOGS.CANCEL_BUTTON' | translate }}
    </button>
    <button mat-flat-button class="btn-save" (click)="onSave()">
        {{ 'DIALOGS.SAVE_BUTTON' | translate }}
    </button>
</div>
