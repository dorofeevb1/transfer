<div class="dialog-container">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{ 'DIALOGS.IMPORT_DATA_TITLE' | translate }}</h2>
        <button mat-icon-button (click)="onCancel()" [attr.aria-label]="'DIALOGS.CLOSE_DIALOG_ARIA' | translate">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="dialog-content">
        <div class="upload-area" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)" [class.drag-over]="isDragOver" [class.loading]="isLoading">

            <div *ngIf="!isLoading" class="upload-prompt">
                <mat-icon class="upload-icon">cloud_upload</mat-icon>
                <p>{{ 'DIALOGS.DROP_FILES_HERE' | translate }}</p>
                <button type="button" mat-stroked-button color="primary" (click)="fileInput.click()">
                    {{ 'DIALOGS.SELECT_FILES' | translate }}
                </button>
                <p class="file-info">{{ 'DIALOGS.FILE_INFO' | translate }}</p>
                <input type="file" #fileInput (change)="onFileSelected($event)" multiple hidden
                    accept=".xlsx, .xls, .csv">
            </div>

            <div *ngIf="isLoading" class="loading-indicator">
                <mat-progress-spinner mode="indeterminate" [diameter]="50"></mat-progress-spinner>
                <p>{{ 'DIALOGS.PROCESSING' | translate }}</p>
            </div>
        </div>

        <div class="file-list" *ngIf="files.length > 0">
            <div *ngFor="let file of files" class="file-item">
                <mat-icon>insert_drive_file</mat-icon>
                <span class="file-name">{{ file.name }}</span>
                <span class="file-size">{{ (file.size / 1024 / 1024).toFixed(2) }} MB</span>
                <button mat-icon-button (click)="removeFile(file)"
                    [attr.aria-label]="'DIALOGS.REMOVE_FILE_ARIA' | translate">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="dialog-actions">
        <button mat-button (click)="onCancel()">{{ 'DIALOGS.CANCEL_BUTTON' | translate }}</button>
        <button mat-flat-button color="primary" (click)="onImport()" [disabled]="!files.length">
            {{ 'DIALOGS.PROCESS_BUTTON' | translate }}
        </button>
    </mat-dialog-actions>
</div>
