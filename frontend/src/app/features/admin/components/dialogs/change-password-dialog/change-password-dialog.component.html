<h1 mat-dialog-title>{{ 'DIALOGS.CHANGE_PASSWORD_TITLE' | translate }}</h1>

<div mat-dialog-content [formGroup]="form">
    <p>{{ 'DIALOGS.CHANGE_PASSWORD_INSTRUCTION' | translate }}</p>

    <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>{{ 'USERS_TABLE.COLUMNS.PASSWORD' | translate }}</mat-label>
        <input matInput formControlName="password" type="password">
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>{{ 'DIALOGS.CONFIRM_PASSWORD_LABEL' | translate }}</mat-label>
        <input matInput formControlName="confirmPassword" type="password">
        <mat-error *ngIf="form.hasError('mismatch')">
            {{ 'VALIDATION.PASSWORDS_MISMATCH' | translate }}
        </mat-error>
    </mat-form-field>
</div>

<div mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">
        {{ 'DIALOGS.CANCEL_BUTTON' | translate }}
    </button>
    <button mat-flat-button color="warn" (click)="onSave()" [disabled]="form.invalid">
        {{ 'DIALOGS.SEND_BUTTON' | translate }}
    </button>
</div>
