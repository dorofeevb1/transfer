<div class="users-page-container">
    <!-- Панель для массового редактирования (появляется при выборе 2+ строк) -->


    <!-- Обычная панель управления (скрывается в режиме массового редактирования) -->
    <ng-container>
        <div class="page-header">
            <h1>Пользователи</h1>
            <button mat-flat-button color="warn" (click)="openAddDialog()">Добавить пользователя</button>
        </div>

        <div class="table-controls">
            <mat-form-field class="search-field" appearance="outline">
                <input matInput (keyup)="applyFilter($event)" placeholder="Поиск по любому из полей таблицы">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
            <button mat-stroked-button class="filter-button">
                <mat-icon>filter_list</mat-icon>
                <span>Фильтр</span>
            </button>
        </div>

        <!-- Панель для ОДИНОЧНОГО выбора -->
        <div class="selection-toolbar" *ngIf="selection.selected.length === 1">
            <span>Выбрано 1</span>
            <div class="actions">
                <button mat-button (click)="openEditDialog()">
                    <mat-icon>edit</mat-icon> Редактировать
                </button>
                <button mat-button color="warn" (click)="deleteSelected()">
                    <mat-icon>delete</mat-icon> Удалить
                </button>
            </div>
        </div>

        <div class="bulk-actions-header" *ngIf="isBulkEditMode">
            <span>Выбрано {{selection.selected.length}}</span>
            <div class="actions">
                <button mat-flat-button color="primary" (click)="saveBulkChanges()">Сохранить</button>
                <button mat-stroked-button (click)="cancelBulkEdit()">Отмена</button>
            </div>
        </div>
    </ng-container>

    <!-- Таблица -->
    <div class="table-container mat-elevation-z2">
        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="fio">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ФИО</th>
                <td mat-cell *matCellDef="let element">{{element.fio}}</td>
            </ng-container>

            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Роль</th>
                <td mat-cell *matCellDef="let element">
                    <ng-container *ngIf="!selection.isSelected(element); else roleEditTemplate">
                        {{element.role}}
                    </ng-container>
                    <ng-template #roleEditTemplate>
                        <mat-form-field appearance="outline" class="inline-edit-field">
                            <input matInput [(ngModel)]="element.role">
                        </mat-form-field>
                    </ng-template>
                </td>
            </ng-container>

            <ng-container matColumnDef="access">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Доступ</th>
                <td mat-cell *matCellDef="let element">
                    <ng-container *ngIf="!selection.isSelected(element); else accessEditTemplate">
                        {{element.access}}
                    </ng-container>
                    <ng-template #accessEditTemplate>
                        <mat-form-field appearance="outline" class="inline-edit-field">
                            <mat-select [(ngModel)]="element.access">
                                <mat-option value="Просмотр и редактирование">Просмотр и редактирование</mat-option>
                                <mat-option value="Только просмотр">Только просмотр</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </ng-template>
                </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>E-mail</th>
                <td mat-cell *matCellDef="let element">
                    <div class="cell-with-button">
                        <span>{{element.email}}</span>
                        <button *ngIf="selection.isSelected(element)" mat-stroked-button class="cell-action-button"
                            (click)="openChangeEmailDialog(element)">Изменить</button>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="password">
                <th mat-header-cell *matHeaderCellDef>Пароль</th>
                <td mat-cell *matCellDef="let element">
                    <div class="cell-with-button">
                        <span>********</span>
                        <button *ngIf="selection.isSelected(element)" mat-stroked-button class="cell-action-button"
                            (click)="openChangePasswordDialog()">Изменить</button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                [class.bulk-editing-row]="selection.isSelected(row)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">Нет данных</td>
            </tr>
        </table>
    </div>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons [length]="totalUsersCount"></mat-paginator>

</div>
