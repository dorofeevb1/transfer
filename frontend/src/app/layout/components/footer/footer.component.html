<footer class="brio-footer" role="contentinfo">
    <div class="brio-footer__container">

        <!-- Верхний ряд: Лого, Слоган, Сайт -->
        <div class="footer-row header-row">
            <div class="brand-block">
                <!-- Логотип -->
                <img src="./assets/Group.png" alt="Brio Trade" class="logo-img">

                <!-- Вертикальный разделитель -->
                <div class="vertical-divider"></div>

                <!-- Текст стратегии -->
                <div class="strategy-text">
                    <p class="headline" [innerHTML]="'FOOTER.STRATEGY_HEADLINE' | translate"></p>
                    <p class="subline">{{ 'FOOTER.STRATEGY_SUBLINE' | translate }}</p>
                </div>
            </div>

            <!-- Ссылка на сайт (справа) -->
            <a class="site-link" href="https://brio-trade.ru" target="_blank">BRIO-TRADE.RU</a>
        </div>

        <!-- Горизонтальная линия -->
        <div class="horizontal-divider"></div>

        <!-- Нижний ряд: Персона, Контакты, Адрес -->
        <div class="footer-row info-row">

            <!-- Блок персоны -->
            <div class="info-col person-block">
                <span class="person-name">{{ 'FOOTER.PERSON_NAME' | translate }}</span>
                <span class="person-title">{{ 'FOOTER.PERSON_TITLE' | translate }}</span>
            </div>

            <!-- Блок контактов -->
            <div class="info-col contacts-block">
                <a class="contact-link" href="tel:+74985404092">+7 (498) 540-40-92</a>
                <a class="contact-link" href="tel:+79166310497">+7 (916) 631-04-97</a>
                <a class="contact-link email" href="mailto:syv@brio-trade.ru">syv@brio-trade.ru</a>
            </div>

            <!-- Блок адреса -->
            <div class="info-col address-block">
                {{ 'FOOTER.ADDRESS' | translate }}
            </div>
        </div>

    </div>
</footer>
