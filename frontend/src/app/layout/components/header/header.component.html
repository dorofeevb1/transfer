<div class="header-container">
    <!-- Логотип -->
    <div class="logo-section">
        <img src="assets/logo.png" alt="Brio Trade & Logistic" class="logo">
    </div>

    <div class="header-actions">

        <!-- 1. Переключатель языка -->
        <div class="lang-switcher" [matMenuTriggerFor]="langMenu">
            <span class="lang-text">{{ currentLang === 'ru' ? 'RU' : 'ZH' }}</span>
            <mat-icon class="chevron">expand_more</mat-icon>
        </div>
        <mat-menu #langMenu="matMenu">
            <button mat-menu-item (click)="switchLang('ru')">RU</button>
            <button mat-menu-item (click)="switchLang('zh')">中文</button>
        </mat-menu>

        <!-- 2. Настройки (Скрыты, если не админ) -->
        <ng-container *ngIf="isAdmin$ | async">
            <button mat-icon-button class="action-btn settings-btn" [matMenuTriggerFor]="adminMenu"
                [matTooltip]="'HEADER.SETTINGS' | translate">
                <mat-icon>settings</mat-icon>
            </button>
        </ng-container>

        <!-- Меню админа -->
        <mat-menu #adminMenu="matMenu">
            <button mat-menu-item routerLink="/admin/products">
                <mat-icon>inventory_2</mat-icon>
                <span>{{ 'HEADER.PRODUCTS' | translate }}</span>
            </button>
            <button mat-menu-item routerLink="/admin/users">
                <mat-icon>people</mat-icon>
                <span>{{ 'HEADER.USERS' | translate }}</span>
            </button>
        </mat-menu>

        <!-- 3. Профиль пользователя -->
        <div class="user-profile" [matMenuTriggerFor]="userMenu">
            <div class="avatar-circle">
                <mat-icon>person</mat-icon>
            </div>
            <div class="user-info">
                <!-- Имя пользователя -->
                <span class="user-name">{{ userName }}</span>

                <!-- Роль: Динамический перевод на основе роли -->
                <span class="user-role">
                    {{ 'USERS_TABLE.ROLES.' + (userRole | uppercase) | translate }}
                </span>
            </div>
            <mat-icon class="dropdown-arrow">expand_more</mat-icon>
        </div>

        <!-- Меню пользователя (Логаут) -->
        <mat-menu #userMenu="matMenu">
            <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>{{ 'HEADER.LOGOUT' | translate }}</span>
            </button>
        </mat-menu>

    </div>
</div>
