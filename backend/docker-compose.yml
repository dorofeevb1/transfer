services:
  db:
    image: postgres:18-alpine
    container_name: brio_postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: brio_django_web
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate && 
             gunicorn --bind 0.0.0.0:8000 brio_backend.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    # Секция 'ports' удалена. Сервис web не должен быть доступен извне.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: brio_nginx
    ports:
      # Внешний порт 8000 хоста сопоставляется с портом 80 контейнера Nginx.
      - "8000:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
