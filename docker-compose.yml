version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=django_tables_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # Для VPS можно поставить 3 воркера (чуть мощнее, чем на апельсинке)
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 1200 --workers 3 --keep-alive 60
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - SECRET_KEY=prod_secret_key_change_me_fast
      - DEBUG=0
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=django_tables_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=*
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"   # HTTP
      - "443:443" # HTTPS (Добавлено!)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # ВАЖНО: Прокидываем сертификаты с хоста внутрь (только для чтения)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume: